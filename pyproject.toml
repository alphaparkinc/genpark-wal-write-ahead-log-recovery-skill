[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-wal-write-ahead-log-recovery-skill"
version = "1.0.0"
description = "Write-Ahead Logging (WAL) crash recovery engine implementing ARIES redo and undo passes."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AlphaPark Team", email = "engineering@alphapark.ai"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Database :: Database Engines/Servers"
]

[project.urls]
Homepage = "https://github.com/alphaparkinc/genpark-wal-write-ahead-log-recovery-skill"
Repository = "https://github.com/alphaparkinc/genpark-wal-write-ahead-log-recovery-skill.git"
Issues = "https://github.com/alphaparkinc/genpark-wal-write-ahead-log-recovery-skill/issues"
